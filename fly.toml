# Fly.io config for the PUBLIC SANDBOX (synthetic data, read-only). Deploy:  fly launch --no-deploy --copy-config --name <your-app>  &&  fly deploy
# Set the hostname the app is served under so the Host check accepts it:  fly secrets set MEMBRIDGE_PUBLIC_HOST=<your-app>.fly.dev
app = "membridge-sandbox"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.sandbox"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/api/ping"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
