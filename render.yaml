# Render blueprint for the PUBLIC SANDBOX (synthetic data, read-only). New > Blueprint > point at this repo.
# Render announces the service hostname (RENDER_EXTERNAL_HOSTNAME), which the app accepts automatically: nothing to configure.
services:
  - type: web
    name: membridge-sandbox
    runtime: docker
    dockerfilePath: ./Dockerfile.sandbox
    healthCheckPath: /api/ping
    plan: free
